{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- External Libraries -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" href="{% static 'images/favicon.webp' %}">

    <!-- Global Styles -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Page-Specific Styles -->
    {% block extra_css %}{% endblock %}

    <title>FYPAS | {% if header_title %}{{ header_title }}{% else %}{{ head_title }}{% endif %}</title>


    <style>
        .student-section {
            margin-bottom: 20px;
        }
    </style>
</head>


<body>
    {% include "sidebar.html" with user_role=user_role %}

    <!-- Main Content -->
    <main class="main-content" id="main-content">
        <!-- Header -->
        {% include 'header.html'%}
        {% block start %}
        {% endblock %}
    </main>
    <!-- Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>

</html>
