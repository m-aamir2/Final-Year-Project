{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FYPAS | Change Password</title>
  <link rel="stylesheet" href="{% static 'css/accounts/force_password_change.css' %}" />
  <link rel="stylesheet" href="{% static 'css/alert.css' %}" />
      <link rel="icon" href="{% static 'images/favicon.webp' %}">

  <style>
    body {
      font-family: "Inter", sans-serif;
      background: linear-gradient(to right, #f0f7ff, #e4f0ff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.3s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h2 {
      text-align: center;
      color: #327b32;
      margin-bottom: 1.5rem;
      font-weight: 700;
    }
    .form-group {
      position: relative;
      margin-bottom: 1.5rem;
    }
    label {
      font-weight: 600;
      color: #333;
      display: block;
      margin-bottom: 0.4rem;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.75rem 2.5rem 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }
    input[type="password"]:focus {
      border-color: #327b32;
      box-shadow: 0 0 0 2px #d8f3dc;
    }

    /* Inline validation styling */
    .validation-message {
      margin-top: 0.3rem;
      font-size: 0.9rem;
      color: #666;
      transition: color 0.3s;
    }
    .validation-message.valid {
      color: #327b32;
      font-weight: 500;
    }
    .validation-message.invalid {
      color: #e63946;
    }

    #matchMessage {
      font-size: 0.9rem;
      margin-top: 0.3rem;
      color: #e63946;
      display: none;
    }

    .error-box {
      background: #fdecea;
      border-left: 4px solid #e63946;
      color: #a10000;
      padding: 10px 12px;
      border-radius: 8px;
      margin-top: 1rem;
      font-size: 0.95rem;
      display: none;
      margin-bottom: 1rem;
    }

    .success-box {
      background: #e7f9ed;
      border-left: 4px solid #327b32;
      color: #155d27;
      padding: 10px 12px;
      border-radius: 8px;
      margin-top: 1rem;
      font-size: 0.95rem;
      display: none;
    }

    .btn {
      width: 100%;
      background-color: #327b32;
      color: white;
      padding: 0.75rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      font-weight: 600;
    }
    .btn:hover {
      background-color: #286628;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Change Your Password</h2>
    <form id="passwordForm" method="POST" action="{% url 'force_password_change' %}">
      {% csrf_token %}

      <div class="form-group">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" required />
        <img
          src="{% static 'images/eye-off.svg' %}"
          class="toggle-password"
          onclick="toggleVisibility('new_password', this)"
        />
        <div class="validation-message" id="length">• At least 8 characters</div>
        <div class="validation-message" id="uppercase">• Contains uppercase letter</div>
        <div class="validation-message" id="lowercase">• Contains lowercase letter</div>
        <div class="validation-message" id="number">• Contains a number</div>
        <div class="validation-message" id="special">• Contains a special character (!@#$%^&*)</div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required />
        <img
          src="{% static 'images/eye-off.svg' %}"
          class="toggle-password"
          onclick="toggleVisibility('confirm_password', this)"
        />
        <div id="matchMessage">Passwords do not match</div>
      </div>

      <div class="error-box" id="errorBox"></div>
      <div class="success-box" id="successBox"></div>

      {% if error %}
      <p class="alert alert-error">{{ error }}</p>
      {% endif %}
      <button type="submit" class="btn">Update Password</button>
    </form>
  </div>

  <script>
    function toggleVisibility(inputId, toggleIcon) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === "password";
      input.type = isPassword ? "text" : "password";
      toggleIcon.src = isPassword
        ? "{% static 'images/eye-open.svg' %}"
        : "{% static 'images/eye-off.svg' %}";
    }

    const password = document.getElementById("new_password");
    const confirmPassword = document.getElementById("confirm_password");
    const form = document.getElementById("passwordForm");
    const matchMessage = document.getElementById("matchMessage");
    const errorBox = document.getElementById("errorBox");
    const successBox = document.getElementById("successBox");

    password.addEventListener("input", () => {
      const value = password.value;
      const validations = {
        length: value.length >= 8,
        uppercase: /[A-Z]/.test(value),
        lowercase: /[a-z]/.test(value),
        number: /[0-9]/.test(value),
        special: /[!@#$%^&*]/.test(value),
      };

      for (const [key, valid] of Object.entries(validations)) {
        const element = document.getElementById(key);
        element.classList.toggle("valid", valid);
        element.classList.toggle("invalid", !valid);
      }
    });

    confirmPassword.addEventListener("input", () => {
      matchMessage.style.display =
        confirmPassword.value && password.value !== confirmPassword.value
          ? "block"
          : "none";
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault(); // prevent default submission first
      const value = password.value;
      const isStrong =
        value.length >= 8 &&
        /[A-Z]/.test(value) &&
        /[a-z]/.test(value) &&
        /[0-9]/.test(value) &&
        /[!@#$%^&*]/.test(value);

      // Reset messages
      errorBox.style.display = "none";
      successBox.style.display = "none";

      if (!isStrong) {
        errorBox.textContent = "Your password must meet all the strength requirements.";
        errorBox.style.display = "block";
        return;
      }

      if (password.value !== confirmPassword.value) {
        errorBox.textContent = "Passwords do not match.";
        errorBox.style.display = "block";
        return;
      }

      // Show success
      successBox.textContent = "Password looks strong and secure! Updating...";
      successBox.style.display = "block";

      // Simulate short delay before submitting
      setTimeout(() => form.submit(), 800);
    });
  </script>
</body>
</html>
