{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="{% static 'images/favicon.webp' %}">
  <title>FYPAS - Password Reset</title>
  <link rel="stylesheet" href="{% static 'css/accounts/login.css' %}">
  <link rel="stylesheet" href="{% static 'css/alert.css' %}">
  <link rel="stylesheet" href="{% static 'css/accounts/password_reset_request.css' %}">
  <style>
    /* Responsive Design */
    @media (max-width:600px) {
      .formContainer {
        max-width: 400px;
      }

      .span {
        font-size: 22px;
      }

      .label {
        font-size: 17px;
      }

      .container {
        max-width: 92vw;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="formContainer">
      <form class="form" method="post" onsubmit="handleSubmit()">
        {% csrf_token %}
        <div class="logo">
          <div>
            <a href="/">
              <img src="{% static 'images/uol-logo-green.svg' %}" alt="Logo" class="uol-logo" />
            </a>
          </div>
          <span class="span">Reset Your <span class="highlight">FYPAS</span> Password</span>
        </div>
        {% if messages %}
        {% for message in messages %}
        <p class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-error{% endif %}">{{ message }}
        </p>
        {% endfor %}
        {% endif %}
        <div class="formGroup">
          <label for="email" class="label">Email address:</label>
          <input class="input" type="email" id="email" name="email" placeholder="Enter your email" required />
        </div>
        <button type="submit" class="button" id="submitButton">Send Reset Link</button>
      </form>
    </div>
  </div>
  <script>
    function handleSubmit() {
      const button = document.getElementById('submitButton');
      button.disabled = true;
      button.textContent = 'Sending...';
    }
  </script>
</body>

</html>
