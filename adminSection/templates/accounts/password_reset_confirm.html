{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="{% static 'images/favicon.webp' %}">
  <title>FYPAS - Set New Password</title>
  <link rel="stylesheet" href="{% static 'css/accounts/login.css' %}">
  <link rel="stylesheet" href="{% static 'css/alert.css' %}">
  <link rel="stylesheet" href="{% static 'css/accounts/password_reset_confirm.css' %}">
</head>
<body>
  <div class="container">
    <div class="formContainer">
      <form class="form" method="post">
        {% csrf_token %}
        <div class="logo">
          <div>
            <a href="/">
              <img src="{% static 'images/uol-logo-green.svg' %}" alt="Logo" class="uol-logo" />
            </a>
          </div>
          <span class="span">Set New <span class="highlight">FYPAS</span> Password</span>
        </div>
        {% if error %}
          <p class="alert alert-error">{{ error }}</p>
        {% endif %}
        {% if success %}
          <p class="alert alert-success">{{ success }}</p>
        {% endif %}
        <div class="formGroup">
          <label for="new_password" class="label">New Password:</label>
          <input class="input" type="password" id="new_password" name="new_password" placeholder="Enter new password" required />
        </div>
        <div class="formGroup">
          <label for="confirm_password" class="label">Confirm Password:</label>
          <input class="input" type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required />
        </div>
        <button type="submit" class="button">Reset Password</button>
      </form>
    </div>
  </div>
</body>
</html>
