<svg width="400" height="150" viewBox="0 0 300 150"
								xmlns="http://www.w3.org/2000/svg">
								<style>
									.text {
										font-family: Poppins, sans-serif;
										font-size: 60px;
										font-weight: bold;
									}

									.f {
										fill: #fff;
									}

									.y {
										fill: #32CD32;
									}

									.p {
										fill: #fff;
									}

									.a {
										fill: #32CD32;
									}

									.s {
										fill: #fff;
									}
								</style>
								<g transform="translate(20, 80)">
